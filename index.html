<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNY Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .video-wrapper {
      width: 100%;
      max-width: 640px;
      padding: 0 8px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      display: block;
      background: #111;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video controls playsinline preload="auto">
      <source src="CNY.mp4" type="video/mp4">
    </video>
  </div>
</body>
</html>
